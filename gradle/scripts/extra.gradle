// You may write any gradle buildscript component in this file
// This file is automatically applied after build.gradle + dependencies.gradle is ran

// If you wish to use the default helper methods, uncomment the line below
// apply from: 'gradle/scripts/helpers.gradle'

// Development test addon. A separate mod (statusworks_devtest) that registers test definitions
// through the public API, the way a real addon would. Its classes are on the runClient and
// runServer classpath only; the jar, sources jar, and reobfuscated jar contain the main source
// set alone, so the shipped mod never carries test content.
sourceSets {
    devtest {
        // Sources and resources come from the default src/devtest/java and src/devtest/resources.
        // FML reads a dev mod's mcmod.info and lang files from its class directory, so resources go there too.
        output.resourcesDir = java.destinationDirectory.get().asFile
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

['runClient', 'runServer'].each { taskName ->
    tasks.named(taskName, JavaExec).configure { JavaExec task ->
        task.classpath += sourceSets.devtest.output
        task.dependsOn tasks.named('devtestClasses')
    }
}

// The development dedicated server runs in its own folder (run/server) instead of sharing run/ with the
// client, so client and server logs, configuration, and worlds never mix.
tasks.named('runServer', JavaExec).configure { JavaExec task ->
    task.workingDir = file('run/server')
    task.doFirst { file('run/server').mkdirs() }
}

// The development test addon as a reobfuscated jar, for a launch in a production instance (Cleanroom). Built only
// on request (gradlew devtestReobfJar), into build/devtest-libs, never by build or assemble, so the release output in
// build/libs never holds it.
def devtestJar = tasks.register('devtestJar', Jar) {
    group = 'devtest'
    description = 'Packs the development test addon (deobfuscated names).'
    archiveBaseName = 'statusworks_devtest'
    archiveClassifier = 'dev'
    destinationDirectory = layout.buildDirectory.dir('devtest-libs')
    from sourceSets.devtest.output
    dependsOn tasks.named('devtestClasses')
}
// An applied script cannot name plugin classes, so the task type comes from the plugin's own reobfJar task.
def reobfType = tasks.named('reobfJar').get().class.classLoader
        .loadClass('com.gtnewhorizons.retrofuturagradle.mcp.ReobfuscatedJar')
tasks.register('devtestReobfJar', reobfType) { t ->
    group = 'devtest'
    description = 'Reobfuscates the development test addon for a production instance.'
    def main = tasks.named('reobfJar').get()
    t.setInputJarFromTask(devtestJar)
    t.mcVersion.set(main.mcVersion)
    t.srg.set(main.srg)
    t.fieldCsv.set(main.fieldCsv)
    t.methodCsv.set(main.methodCsv)
    t.exceptorCfg.set(main.exceptorCfg)
    t.recompMcJar.set(main.recompMcJar)
    t.extraSrgEntries.set(main.extraSrgEntries)
    t.extraSrgFiles.from(main.extraSrgFiles)
    t.referenceClasspath.from(main.referenceClasspath)
    t.referenceClasspath.from(sourceSets.main.output)
    t.archiveBaseName = 'statusworks_devtest'
    t.archiveClassifier = ''
    t.destinationDirectory = layout.buildDirectory.dir('devtest-libs')
    t.dependsOn(devtestJar)
}
